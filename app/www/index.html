<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17191E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Wizard">
<title>Wizard Block</title>
<style>
:root{
  --bg:#EFEDEA; --card:#FFFFFF; --soft:#F5F3F0; --line:#E4E0DA;
  --ink:#1D2026; --ink2:#44484F; --muted:#8C8F96;
  --accent:#D0814B; --accent2:#DE9A6C; --accent-soft:#F8E6DA;
  --ok:#3F8F63; --ok-soft:#E2EFE6; --bad:#C2493D; --bad-soft:#F7E1DC;
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:14px;
  --shadow:0 1px 2px rgba(20,22,26,.04),0 8px 24px rgba(20,22,26,.06);
  --shadow-nav:0 10px 30px rgba(20,22,26,.14);
  --btn-bg:#1D2026; --btn-fg:#FFFFFF; --acc-fg:#A85C2A; --banner-fg:#8A4A1F; --nil:#C5C2BC;
  --g-future:#E3DFD9; --g-done1:#D0814B; --g-done2:#DE9A6C; --g-cur:#F0C7A8; --grid:#D8D4CE;
  --knob:#FFFFFF; --grab:#D2CEC7; --overlay:rgba(20,22,26,.45); --input-focus:#ECE9E5;
  --full-bg:#1D2026; --full-muted:#A6A9B0; --full-pad:#2C3038; --fade0:rgba(239,237,234,0);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="dark"]{
  --bg:#17191E; --card:#22252C; --soft:#2C3038; --line:#343944;
  --ink:#F2EEE8; --ink2:#C9C4BC; --muted:#8C9099;
  --accent:#D98B56; --accent2:#E6A57A; --accent-soft:#3A2E2A;
  --ok:#6CC191; --ok-soft:#1E3530; --bad:#EE7F70; --bad-soft:#432A2C;
  --shadow:0 1px 2px rgba(0,0,0,.22),0 8px 24px rgba(0,0,0,.22);
  --shadow-nav:0 10px 30px rgba(0,0,0,.45);
  --btn-bg:#D98B56; --btn-fg:#17191E; --acc-fg:#E6A57A; --banner-fg:#E6A57A; --nil:#4A4F5A;
  --g-future:#2E323B; --g-done1:#D98B56; --g-done2:#E6A57A; --g-cur:#6E4A35; --grid:#343944;
  --knob:#F2EEE8; --grab:#3E434E; --overlay:rgba(0,0,0,.55); --input-focus:#2E323B;
  --full-bg:#0F1013; --full-muted:#8C9099; --full-pad:#22252C; --fade0:rgba(23,25,30,0);
}
html{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;
  padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + 120px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top .title{font-size:15px;font-weight:600;color:var(--ink2);text-align:center;flex:1}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;
  box-shadow:var(--shadow);flex:none}
.ibtn svg{width:20px;height:20px}
.h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:14px 4px 4px}
.lead{color:var(--muted);font-size:15px;margin:0 4px 22px}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.sec{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:26px 6px 10px;display:flex;justify-content:space-between;align-items:center}
.sec a{text-transform:none;letter-spacing:0;color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;
  background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow)}
.pill .dot{width:10px;height:10px;border-radius:50%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:999px;
  background:var(--btn-bg);color:var(--btn-fg);font-weight:650;font-size:16.5px;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35}
.btn.light{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.accent{background:var(--accent)}
.btn.small{height:44px;font-size:15px;width:auto;padding:0 20px}
.linkbtn{display:block;margin:12px auto 0;color:var(--muted);font-weight:600;font-size:14.5px;padding:8px}
.hint{text-align:center;color:var(--muted);font-size:13.5px;margin:10px 0 0;min-height:18px}
.hint.bad{color:var(--bad)}

/* Home */
.hero{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:18px 18px 20px;margin-bottom:14px}
.hero .row{display:flex;justify-content:space-between;align-items:flex-start}
.hero .k{font-size:13px;color:var(--muted);font-weight:600}
.hero .v{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.hero .mini{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.lst .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.lst .it:last-child{border-bottom:0}
.lst .it .t{font-weight:650;font-size:15.5px}
.lst .it .s{font-size:13px;color:var(--muted);margin-top:2px}
.lst .it .r{margin-left:auto;text-align:right;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14.5px}

/* Setup */
.eds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed{background:var(--card);border-radius:var(--r-lg);padding:14px;text-align:left;box-shadow:var(--shadow);
  border:2px solid transparent;min-height:132px;display:flex;flex-direction:column;transition:border-color .15s}
.ed.on{border-color:var(--ink)}
.ed .ic{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;margin-bottom:auto}
.ed.on .ic{background:var(--accent-soft)}
.ed .ic svg{width:22px;height:22px}
.ed .ic{color:var(--ink)}
.ed.on .ic{color:var(--acc-fg)}
.win .crown{color:var(--acc-fg)}
.ed .n{font-weight:700;font-size:15.5px;margin-top:12px}
.ed .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{flex:1;height:40px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--btn-bg);color:var(--btn-fg)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0}
.prow+.prow{border-top:1px solid var(--line)}
.prow input{flex:1;border:0;background:var(--soft);border-radius:var(--r-sm);height:44px;padding:0 14px;font-size:16px;outline:none;min-width:0}
.prow input:focus{background:var(--input-focus)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.av.sm{width:30px;height:30px;font-size:12.5px}
.av.xs{width:22px;height:22px;font-size:10px}
.mbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--soft);flex:none}
.mbtn svg{width:16px;height:16px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:var(--r-md);
  background:var(--soft);color:var(--ink2);font-weight:600;width:100%;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;background:var(--card);font-weight:600;font-size:14px;color:var(--ink2);
  box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:7px;border:2px solid transparent}
.chip.on{border-color:var(--ink);color:var(--ink)}
.tg{display:flex;align-items:center;gap:12px;padding:12px 2px}
.tg+.tg{border-top:1px solid var(--line)}
.tg .tx{flex:1}
.tg .tx b{display:block;font-size:15.5px;font-weight:650}
.tg .tx span{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.sw{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(var(--safe-b) + 16px);
  background:linear-gradient(to top,var(--bg) 70%,var(--fade0));z-index:20}
.sticky .in{max-width:424px;margin:0 auto}
.sum{text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:10px}

/* Gauge */
.gauge{position:relative;margin:0 auto;width:100%;max-width:330px}
.gauge svg{display:block;width:100%;height:auto}
.gmeta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 16px}

/* Round */
.phase{display:flex;gap:8px;margin:0 0 12px}
.phase div{flex:1;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;font-size:14px;color:var(--muted);background:transparent;border:1.5px solid var(--line)}
.phase div.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.phase div.dn{color:var(--ok);border-color:var(--ok-soft);background:var(--ok-soft)}
.phase i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:rgba(255,255,255,.18)}
.phase div:not(.on) i{background:var(--soft)}
.sbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r-md);padding:12px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.sbar .l{font-size:13px;color:var(--muted);font-weight:600}
.sbar .n{font-size:22px;font-weight:750;letter-spacing:-.4px}
.sbar .n small{font-size:14px;color:var(--muted);font-weight:600}
.tag{height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.mid{background:var(--accent-soft);color:var(--acc-fg)}
.tag.neu{background:var(--soft);color:var(--ink2)}
.pl{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:box-shadow .2s}
.pl.cur{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm span{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.badge.dl{background:var(--btn-bg);color:var(--btn-fg)}
.badge.or{background:var(--accent-soft);color:var(--acc-fg)}
.pl .nm span.badge{color:var(--ink2)}
.pl .nm span.badge.dl{color:var(--btn-fg)}
.pl .nm span.badge.or{color:var(--acc-fg)}
.pl .nm span.badge.no{background:var(--bad);color:#fff}
.stp{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px;flex:none}
.stp button{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:21px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stp button:active{transform:scale(.92)}
.stp .val{min-width:40px;text-align:center;font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}
.stp .val.nil{color:var(--nil)}
.stp.sm button{width:32px;height:32px;font-size:18px}
.stp.sm .val{min-width:30px;font-size:17px}
.bidchip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:14px;background:var(--soft);flex:none}
.bidchip small{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.bidchip b{font-size:17px;font-weight:750;line-height:1}
.bidchip.cl b{color:var(--acc-fg)}
.secbtn{height:44px;padding:0 16px;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);font-weight:650;font-size:14px;flex:none}
.secbtn.done{background:var(--ok-soft);color:var(--ok)}
.opt{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:4px 14px;margin:6px 0 10px}
.banner{background:var(--accent-soft);color:var(--banner-fg);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.4;margin-bottom:10px;font-weight:500}
.ex{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.ex .c{background:var(--soft);border-radius:14px;padding:8px 6px 6px;text-align:center}
.ex .c small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.ex .c .stp{background:transparent;padding:0;justify-content:center;gap:2px}
.ex .c .stp button{width:30px;height:30px;font-size:17px}
.ex .c .stp .val{min-width:22px;font-size:17px}
.ex .c{min-width:0}
.exw{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px}
.exw .hd{display:flex;align-items:center;gap:10px}
.mage{height:34px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:650;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.mage.on{background:var(--btn-bg);color:var(--btn-fg)}
.pen{margin-left:auto;font-size:20px;font-weight:750}

/* Table */
.tblw{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.tbls{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:center;font-size:14px;white-space:nowrap}
thead th{padding-top:14px;position:sticky;top:0;background:var(--card)}
th.rn,td.rn{position:sticky;left:0;background:var(--card);color:var(--muted);font-weight:700;font-size:12.5px;width:44px;z-index:1}
tbody tr{border-top:1px solid var(--line)}
tbody tr.edr{cursor:pointer}
tbody tr.edr:active td{background:var(--soft)}
td .tot{font-weight:750;font-size:15.5px;display:block}
td .bt{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:999px;display:inline-block;margin-top:3px}
td .bt.ok{background:var(--ok-soft);color:var(--ok)}
td .bt.bad{background:var(--bad-soft);color:var(--bad)}
td .bt.neu{background:var(--soft);color:var(--muted)}
tfoot td{border-top:2px solid var(--ink);font-weight:800;font-size:17px;padding:12px 6px}
.thn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:650;color:var(--ink2);max-width:72px;margin:0 auto}
.thn span{max-width:68px;overflow:hidden;text-overflow:ellipsis}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.lg span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.lg i{width:10px;height:10px;border-radius:50%}

/* Ranking */
.rk{display:flex;align-items:center;gap:12px;padding:11px 2px}
.rk+.rk{border-top:1px solid var(--line)}
.rk .pos{width:24px;font-weight:750;color:var(--muted);text-align:center}
.rk .nm{flex:1;font-weight:650}
.rk .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:1px}
.rk .sc{font-weight:800;font-size:19px}
.delta{font-weight:750;font-size:15px;min-width:52px;text-align:right}
.delta.p{color:var(--ok)} .delta.m{color:var(--bad)}

/* Nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 16px);z-index:30;
  background:var(--card);border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:var(--shadow-nav)}
.nav button{height:48px;padding:0 20px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:650;font-size:14.5px;color:var(--muted)}
.nav button svg{width:19px;height:19px}
.nav button.on{background:var(--btn-bg);color:var(--btn-fg)}

/* Sheet */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sh{background:var(--bg);width:100%;max-width:460px;border-radius:30px 30px 0 0;padding:10px 18px calc(var(--safe-b) + 20px);max-height:92vh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sh .grab{width:40px;height:5px;border-radius:9px;background:var(--grab);margin:0 auto 14px}
.sh h3{font-size:22px;font-weight:750;letter-spacing:-.4px;margin:2px 4px 4px}
.sh p.s{color:var(--muted);margin:0 4px 16px;font-size:14.5px;line-height:1.4}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{height:56px;border-radius:18px;background:var(--card);font-size:21px;font-weight:700;box-shadow:var(--shadow)}
.pad button.on{background:var(--btn-bg);color:var(--btn-fg)}
.pad button[disabled]{opacity:.25;text-decoration:line-through}
.menu button.mi{display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;border-radius:var(--r-md);background:var(--card);margin-bottom:8px;font-weight:600;font-size:15.5px;box-shadow:var(--shadow);text-align:left}
.menu button.mi.danger{color:var(--bad)}
.menu button.mi svg{width:20px;height:20px;flex:none}
.full{position:fixed;inset:0;z-index:60;background:var(--full-bg);color:#F2EEE8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;animation:fade .2s}
.full .av{width:84px;height:84px;font-size:32px;margin-bottom:18px}
.full h2{font-size:28px;margin:0 0 8px;letter-spacing:-.5px}
.full p{color:var(--full-muted);margin:0 0 30px;font-size:15.5px;line-height:1.45;max-width:300px}
.full .btn{background:#F2EEE8;color:#17191E;max-width:300px}
.full .pad{width:100%;max-width:340px}
.full .pad button{background:var(--full-pad);color:#F2EEE8;box-shadow:none}
.full .pad button[disabled]{opacity:.2}
.rules h4{margin:16px 4px 6px;font-size:15.5px}
.rules p,.rules li{color:var(--ink2);font-size:14.5px;line-height:1.5;margin:0 4px}
.rules ul{padding-left:22px;margin:4px 0}
.win{text-align:center;padding:10px 0 4px}
.win .crown{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin:0 auto 12px}
.win .crown svg{width:30px;height:30px}
.win .k{color:var(--muted);font-weight:600;font-size:14px}
.win .v{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:2px 0}
.win .s{font-size:17px;font-weight:650;color:var(--accent)}
td.lead{color:var(--accent)}
.chk{fill:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat div{background:var(--soft);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:750}
.stat small{font-size:11.5px;color:var(--muted);font-weight:600}

/* Statistik */

<script>
/* ===== CORE (Regeln und Wertung) ===== */
const EDITIONS = {
  classic: { name: 'Wizard', sub: 'Klassik, Deluxe und Das Schwarze Auge', min: 3, max: 10 },
  jubi:    { name: 'Jubiläum', sub: '20, 25 und 30 Jahre mit Sonderkarten', min: 3, max: 10 },
  junior:  { name: 'Wizard Junior', sub: 'Ab 8 Jahren, ein Punkt je Stich', min: 3, max: 6 },
  extreme: { name: 'Wizard Extreme', sub: 'Siegel, Schwarzmagier und Strafpunkte', min: 3, max: 5 }
};
const MODES = { standard: 'Standard', einfarbig: 'Einfarbig', maximus: 'Wizard Maximus' };
const BIDMODES = { open: 'Offen', hidden: 'Verdeckter Tipp', secret: 'Geheime Vorhersage' };
const TRUMPS = {
  blue:   { n: 'Blau', c: '#3F6FB6' }, red: { n: 'Rot', c: '#C4473F' },
  green:  { n: 'Grün', c: '#3E8F68' }, yellow: { n: 'Gelb', c: '#D9A92E' },
  none:   { n: 'Kein Trumpf', c: '#B3AC9D' }
};
const MAXIMUS_TRUMPS = ['blue', 'red', 'green', 'yellow', 'none'];
const COLORS = ['#3F6FB6', '#B8443F', '#3E8F68', '#C9973A', '#7D5BA6', '#2F8C8C', '#B26B3C', '#B5577A', '#5A6788', '#7F8F3A'];
const OLD_COLORS = ['#F0874A', '#6E9BD1', '#6FAA84', '#B07CC6', '#E2B33C', '#E07A8B', '#4FB0AC', '#A47E5C', '#6B7A8F', '#94B84A'];

const nP = g => g.players.length;
const isClassicLike = g => g.edition === 'classic' || g.edition === 'jubi';
const lowWins = g => g.edition === 'extreme';

function totalRounds(g) {
  const n = nP(g);
  if (g.edition === 'junior') return { 3: 8, 4: 8, 5: 7, 6: 6 }[n];
  if (g.edition === 'extreme') return g.extremeLong ? { 3: 6, 4: 8, 5: 10 }[n] : { 3: 6, 4: 4, 5: 5 }[n];
  if (g.edition === 'classic' && g.mode === 'einfarbig') return 12;
  if (g.edition === 'classic' && g.mode === 'maximus') return 5;
  return Math.floor(60 / n);
}
function cardsIn(g, r) {
  if (g.edition === 'extreme') return null;
  if (g.edition === 'classic' && g.mode === 'einfarbig') return r + 4;
  if (g.edition === 'classic' && g.mode === 'maximus') return Math.floor(60 / nP(g));
  return r + 1;
}
const dealerOf = (g, r) => (g.firstDealer + r) % nP(g);
function bidOrder(g, r) {
  const n = nP(g), d = dealerOf(g, r), o = [];
  for (let k = 1; k <= n; k++) o.push((d + k) % n);
  return o; // Geber sagt zuletzt an
}
function defaultTrump(g, r) {
  if (g.edition === 'extreme' || g.edition === 'junior') return null;
  if (g.mode === 'maximus') return MAXIMUS_TRUMPS[r];
  if (g.mode === 'einfarbig') return 'none';
  if (r === totalRounds(g) - 1) return 'none';
  return null;
}
function newRound(g, r) {
  const n = nP(g), z = () => Array(n).fill(0);
  return { bids: z(), tricks: Array(n).fill(null), tipped: Array(n).fill(false), phase: 'bid',
    bomb: false, cloud: { p: -1, d: 1 }, trump: defaultTrump(g, r), done: false,
    ex: { mage: -1, c: z(), b: z(), w: z() } };
}
const sum = a => a.reduce((s, v) => s + (v || 0), 0);
const isTipped = (rd, i) => rd.tipped ? rd.tipped[i] : rd.bids[i] !== null;
const allSet = a => a.every(v => v !== null && v !== undefined);

function effBid(g, rd, i) {
  let b = rd.bids[i];
  if (g.edition === 'jubi' && g.cloud && rd.cloud && rd.cloud.p === i) b += rd.cloud.d;
  return b;
}
function forbiddenBid(g, r, rd) {
  // Plus/Minus Eins: der zuletzt Ansagende (Geber) darf die Summe nicht auf die Kartenzahl bringen
  if (!isClassicLike(g) || !g.plusMinus || g.bidMode !== 'open') return null;
  const d = dealerOf(g, r);
  const others = rd.bids.filter((_, i) => i !== d);
  if (!allSet(others)) return null;
  const f = cardsIn(g, r) - sum(others);
  return f >= 0 ? f : null;
}
function extremeBase(g, r) {
  if (nP(g) === 3 && g.extremeBase5) return 5;
  if (g.extremeLong && r >= totalRounds(g) / 2) return 5;
  return 4;
}
function roundScore(g, r, i) {
  const rd = g.rounds[r];
  if (!rd || !rd.done) return null;
  if (g.edition === 'extreme') {
    const e = rd.ex;
    let p = 3 * e.b[i];
    if (e.mage === i) {
      const blackOthers = e.b.reduce((s, v, k) => s + (k === i ? 0 : v), 0);
      p += Math.max(0, extremeBase(g, r) - blackOthers);
    } else {
      p += 2 * e.c[i] + 4 * e.w[i];
    }
    return p;
  }
  const t = rd.tricks[i];
  if (g.edition === 'junior') {
    const b = rd.bids[i];
    return t === b ? Math.max(b, 1) : 0;
  }
  const b = effBid(g, rd, i);
  return t === b ? 20 + 10 * t : -10 * Math.abs(t - b);
}
function totalsUpTo(g, upto) {
  const n = nP(g), t = Array(n).fill(0);
  for (let r = 0; r < Math.min(upto, g.rounds.length); r++)
    for (let i = 0; i < n; i++) { const s = roundScore(g, r, i); if (s !== null) t[i] += s; }
  return t;
}
const totals = g => totalsUpTo(g, g.rounds.length);
function ranking(g) {
  const t = totals(g);
  const idx = t.map((v, i) => i).sort((a, b) => lowWins(g) ? t[a] - t[b] : t[b] - t[a]);
  let pos = 0, last = null;
  return idx.map((i, k) => { if (t[i] !== last) { pos = k + 1; last = t[i]; } return { i, score: t[i], pos }; });
}
function validateBids(g, r, rd) {
  if (g.bidMode && g.bidMode !== 'open' && rd.tipped && !rd.tipped.every(Boolean)) return 'Noch nicht alle haben getippt';
  if (!allSet(rd.bids)) return 'Noch nicht alle haben angesagt';
  const c = cardsIn(g, r);
  if (rd.bids.some(b => b < 0 || b > c)) return 'Ungültige Ansage';
  if (isClassicLike(g) && g.plusMinus && sum(rd.bids) === c)
    return g.bidMode === 'open' ? 'Plus/Minus Eins: Summe darf nicht ' + c + ' sein' : 'Achtung: Summe ergibt genau ' + c + ' (Plus/Minus Eins)';
  return null;
}
function validateTricks(g, r, rd) {
  if (g.edition === 'extreme') {
    const e = rd.ex;
    if (sum(e.b) > 6) return 'Höchstens 6 schwarze Siegel pro Runde';
    return null;
  }
  if (!allSet(rd.tricks)) return 'Noch nicht alle Stiche eingetragen';
  const need = cardsIn(g, r) - (g.edition === 'jubi' && g.bomb && rd.bomb ? 1 : 0);
  const s = sum(rd.tricks);
  if (s < need) return 'Noch ' + (need - s) + (need - s === 1 ? ' Stich' : ' Stiche') + ' zu verteilen';
  if (s > need) return (s - need) + (s - need === 1 ? ' Stich' : ' Stiche') + ' zu viel';
  if (g.edition === 'jubi' && g.cloud && rd.cloud.p >= 0 && effBid(g, rd, rd.cloud.p) < 0)
    return 'Wolke: Vorhersage kann nicht unter 0 fallen';
  if (g.edition === 'jubi' && g.cloud && rd.cloud.p >= 0 && rd.tricks[rd.cloud.p] < 1)
    return 'Wolke: Wer den Wolken-Stich gewinnt, hat mindestens einen Stich';
  return null;
}
/* ===== END CORE ===== */

/* ===== Speicher ===== */
const LS = 'wizard-block-v1';
let store = { setup: null, game: null, history: [], lastNames: [] };
try { const raw = localStorage.getItem(LS); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} }

const ui = { screen: store.game ? 'game' : 'home', tab: 'round', sheet: null, view: null };
function defaultSetup() {
  const names = ['', '', ''];
  return { edition: 'classic', mode: 'standard', bidMode: 'open', plusMinus: true, hellsehen: false,
    bomb: true, cloud: true, extremeLong: false, extremeBase5: false,
    players: names.map((n, i) => ({ name: n, color: COLORS[i % 6] })), firstDealer: 0 };
}
if (!store.setup) store.setup = defaultSetup();
if (!store.theme) store.theme = 'dark';
function applyTheme() {
  document.documentElement.dataset.theme = store.theme;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', store.theme === 'dark' ? '#17191E' : '#EFEDEA');
}
applyTheme();
if (!store.v2) { store.setup.plusMinus = true; store.v2 = true; }
if (!store.v3) {
  const mapC = c => { const k = OLD_COLORS.indexOf(c); return k >= 0 ? COLORS[k] : c; };
  const fix = ps => ps && ps.forEach(pl => { pl.color = mapC(pl.color); });
  fix(store.setup.players); if (store.game) fix(store.game.players); store.history.forEach(h => fix(h.players));
  store.v3 = true; try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {}
}
function freshPlayers() { store.setup.players = [0, 1, 2].map(i => ({ name: '', color: COLORS[i] })); store.setup.firstDealer = 0; }
function recentNames() {
  const cur = store.setup.players.map(p => (p.name || '').trim().toLowerCase());
  const all = [...(store.lastNames || [])];
  store.history.forEach(h => h.players.forEach(p => all.push(p.name)));
  const out = [];
  all.forEach(n => { const k = (n || '').trim(); if (k && !/^Spieler \d+$/.test(k) && !cur.includes(k.toLowerCase()) && !out.some(o => o.toLowerCase() === k.toLowerCase())) out.push(k); });
  return out.slice(0, 10);
}

/* ===== Helfer ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ini = n => (n || '?').trim().slice(0, 1).toUpperCase();
const fmt = n => n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0';
const num = n => n < 0 ? '−' + Math.abs(n) : String(n);
const av = (p, cls = '') => `<div class="av ${cls}" style="background:${p.color}">${esc(ini(p.name))}</div>`;
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const I = {

  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

  table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M3.5 10h17M10 10v10"/></svg>',
  hat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 2.5l5 13H7z"/><path d="M3 18.5c3 2 15 2 18 0-2.5-1.6-15.5-1.6-18 0z"/><path d="M11 8.5l.6 1.4 1.4.2-1 1 .3 1.4-1.3-.7"/></svg>',

  flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 21c4 0 6.5-2.6 6.5-6.3 0-4.4-4-6.2-4.7-10.7-2.5 1.6-4 4.2-3.6 7.2-1.3-.6-2-1.8-2.2-3C6.4 9.7 5.5 12 5.5 14.7 5.5 18.4 8 21 12 21z"/></svg>',
  crown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 8l4.5 4 4-6.5 4 6.5 4.5-4-2 11H5.5z"/></svg>',

};
const EDICON = { classic: I.hat, jubi: I.star, junior: I.kid, extreme: I.flame };

/* ===== Gauge im Stil der Vorlage ===== */
function gauge(total, doneCount, cur, big, top, bottom) {
  const cx = 150, cy = 150, R = 112, sweep = 240, start = -120;
  const step = sweep / total;
  const arcLen = 2 * Math.PI * R * sweep / 360 / total;
  const w = Math.max(7, Math.min(total <= 6 ? 50 : 30, arcLen * (total <= 6 ? 0.62 : 0.74))), h = total > 14 ? 40 : 46;
  let s = '';
  for (let i = 0; i < total; i++) {
    const a = start + (i + 0.5) * step, rad = a * Math.PI / 180;
    const x = cx + R * Math.sin(rad), y = cy - R * Math.cos(rad);
    let fill = 'var(--g-future)';
    if (i < doneCount) fill = i % 2 ? 'var(--g-done2)' : 'var(--g-done1)';
    else if (i === cur) fill = 'var(--g-cur)';
    s += `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${Math.min(w / 2, 11)}" style="fill:${fill}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)})"/>`;
  }
  return `<div class="gauge"><svg viewBox="0 0 300 236">${s}
    <path d="M150 68 l3.2 8.8 8.8 3.2 -8.8 3.2 -3.2 8.8 -3.2 -8.8 -8.8 -3.2 8.8 -3.2z" style="fill:var(--accent)"/><circle cx="166" cy="70" r="1.8" style="fill:var(--accent2)"/><circle cx="135" cy="88" r="1.4" style="fill:var(--accent2)"/>
    <text x="150" y="112" text-anchor="middle" font-size="14" font-weight="600" style="fill:var(--muted)">${esc(top)}</text>
    <text x="150" y="160" text-anchor="middle" font-size="50" font-weight="800" style="fill:var(--ink)" letter-spacing="-1.5">${esc(big)}</text>
    <text x="150" y="188" text-anchor="middle" font-size="14.5" font-weight="650" style="fill:var(--accent)">${esc(bottom)}</text>
  </svg></div>`;
}

/* ===== Render ===== */
function render() {
  const app = $('#app');
  if (ui.screen === 'home') app.innerHTML = homeHTML();
  else if (ui.screen === 'setup') app.innerHTML = setupHTML();
  else if (ui.screen === 'game' && store.game) app.innerHTML = gameHTML();
  else if (ui.screen === 'end') app.innerHTML = endHTML();
  else { ui.screen = 'home'; app.innerHTML = homeHTML(); }
  renderLayer();
}

function homeHTML() {
  const g = store.game;
  let h = `<div class="top"><button class="ibtn" data-act="theme" aria-label="Design wechseln">${store.theme === 'dark' ? I.sun : I.moon}</button><div class="title">Block der Wahrheit</div>

    <div class="h1">Wizard</div><p class="lead">Punkte zählen ohne Block und Stift.</p>`;
  if (g) {

    h += `<div class="hero"><div class="row"><div><div class="k">Laufendes Spiel</div>
      <div class="v">Runde ${g.current + 1} von ${totalRounds(g)}</div></div>${av(lead)}</div>
      ${gauge(totalRounds(g), done, g.current, String(g.current + 1), EDITIONS[g.edition].name, done ? lead.name + ' führt' : 'Noch keine Wertung')}
      <div class="mini">${g.players.map(p => `<span class="pill"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</span>`).join('')}</div>
      <div style="margin-top:16px"><button class="btn" data-act="resume">Weiterspielen</button></div></div>
      <button class="btn light" data-act="newgame">Neues Spiel</button>`;
  } else {
    h += `<div class="hero">${gauge(15, 6, 6, 'Neu', 'Bereit für', 'eine Partie')}
      <div style="margin-top:6px"><button class="btn" data-act="newgame">Neues Spiel starten</button></div></div>`;
  }
  h += `<div class="sec">Letzte Spiele ${store.history.length ? '<a data-act="clearhist">Leeren</a>' : ''}</div>`;
  if (!store.history.length) h += `<div class="card"><div class="empty">Abgeschlossene Spiele erscheinen hier.</div></div>`;
  else {
    h += `<div class="card lst" style="padding:4px 14px">` + store.history.slice(0, 25).map((hg, k) => {
      const rk = ranking(hg), w = hg.players[rk[0].i];
      const d = new Date(hg.finished || hg.created);
      return `<button class="it" style="width:100%;text-align:left" data-act="viewhist" data-k="${k}">${av(w, 'sm')}
        <div><div class="t">${esc(w.name)} gewinnt</div><div class="s">${EDITIONS[hg.edition].name} · ${hg.players.length} Spieler · ${d.toLocaleDateString('de-DE')}</div></div>
        <div class="r">${num(rk[0].score)}</div></button>`;

}

function setupHTML() {

  let h = `<div class="top"><button class="ibtn" data-act="home" aria-label="Zurück">${I.back}</button>
    <div class="title">Neues Spiel</div><button class="ibtn" data-act="rules" aria-label="Regeln">${I.book}</button></div>
    <div class="sec">Spielversion</div><div class="eds">` +
    Object.entries(EDITIONS).map(([k, e]) => `<button class="ed ${s.edition === k ? 'on' : ''}" data-act="ed" data-v="${k}">
      <div class="ic">${EDICON[k]}</div><div class="n">${e.name}</div><div class="d">${e.sub}</div></button>`).join('') + `</div>`;

  h += `<div class="sec">Mitspieler <span style="text-transform:none;letter-spacing:0">${n} von ${ed.min} bis ${ed.max}</span></div><div class="card" style="padding:6px 14px">` +
    s.players.map((p, i) => `<div class="prow">${av(p)}
      <input data-name="${i}" value="${esc(p.name)}" placeholder="Spieler ${i + 1}" maxlength="16" autocomplete="off">
      ${i > 0 ? `<button class="mbtn" data-act="pup" data-i="${i}" aria-label="Nach oben">${I.up}</button>` : ''}
      ${n > ed.min ? `<button class="mbtn" data-act="pdel" data-i="${i}" aria-label="Entfernen">${I.x}</button>` : ''}</div>`).join('') +
    (n < ed.max ? `<button class="add" data-act="padd">${I.plus.replace('<svg', '<svg width="18" height="18"')} Spieler hinzufügen</button>` : '') + `</div>`;
  const rec = recentNames();
  if (rec.length) h += `<div class="chips" style="margin-top:10px">${rec.map(nm => `<button class="chip" data-act="recent" data-v="${esc(nm)}">${I.plus.replace('<svg', '<svg width="14" height="14"')}${esc(nm)}</button>`).join('')}</div>`;
  if (n > 6 && isClassicLike(s)) h += `<p class="hint" style="text-align:left;margin:8px 6px 0">Offiziell ist Wizard für 3 bis 6 Spieler. Ab 7 Spielern gilt die Hausregel: Runden gleich 60 geteilt durch Spielerzahl (${Math.floor(60 / n)} Runden).</p>`;

  h += `<div class="sec">Wer gibt zuerst?</div><div class="chips">` +
    s.players.map((p, i) => `<button class="chip ${s.firstDealer === i ? 'on' : ''}" data-act="dealer" data-i="${i}">${av(p, 'xs')}${esc(p.name || 'Spieler ' + (i + 1))}</button>`).join('') + `</div>`;

  if (s.edition === 'classic') {
    h += `<div class="sec">Spielmodus</div><div class="seg">` +
      Object.entries(MODES).map(([k, v]) => `<button class="${s.mode === k ? 'on' : ''}" data-act="mode" data-v="${k}">${k === 'maximus' ? 'Maximus' : v}</button>`).join('') + `</div>
      <p class="hint" style="text-align:left;margin:8px 6px 0">${s.mode === 'einfarbig' ? 'Nur 3 oder 4 Spieler. Jeder bekommt eine Farbe, 12 Runden mit 4 bis 15 Karten, kein Trumpf.' : s.mode === 'maximus' ? '5 Runden, immer alle Karten. Trumpf: Blau, Rot, Grün, Gelb, dann kein Trumpf.' : 'Runde 1 eine Karte, jede Runde eine mehr.'}</p>`;
  }
  if (isClassicLike(s)) {
    h += `<div class="sec">Vorhersage</div><div class="seg">` +
      Object.entries(BIDMODES).map(([k, v]) => `<button class="${s.bidMode === k ? 'on' : ''}" data-act="bidmode" data-v="${k}">${k === 'open' ? 'Offen' : k === 'hidden' ? 'Verdeckt' : 'Geheim'}</button>`).join('') + `</div>
      <p class="hint" style="text-align:left;margin:8px 6px 0">${s.bidMode === 'open' ? 'Reihum ansagen, der Geber zuletzt.' : s.bidMode === 'hidden' ? 'Jeder tippt geheim am Handy, danach werden alle gleichzeitig aufgedeckt.' : 'Jeder tippt geheim, aufgedeckt wird erst nach der Stichrunde.'}</p>`;
    h += `<div class="sec">Regeln</div><div class="card" style="padding:2px 14px">
      ${tg('plusMinus', 'Plus/Minus Eins', 'Die Summe aller Vorhersagen darf nicht der Kartenzahl entsprechen.')}
      ${s.edition === 'classic' && s.mode === 'standard' ? tg('hellsehen', 'Hellsehen', 'In Runde 1 hält jeder seine Karte an die Stirn.') : ''}
      ${s.edition === 'jubi' ? tg('bomb', 'Bombe', 'Ein Stich mit der Bombe zählt für niemanden.') + tg('cloud', 'Wolke', 'Wer den Wolken-Stich gewinnt, ändert seine Vorhersage um 1.') : ''}
      </div>`;
    if (s.edition === 'jubi') h += `<p class="hint" style="text-align:left;margin:8px 6px 0">Drache, Fee, Werwolf, Jongleur, Gestaltenwandler, Hexe und Vampir ändern nichts an der Zählung.</p>`;
  }
  if (s.edition === 'extreme') {
    h += `<div class="sec">Optionen</div><div class="card" style="padding:2px 14px">
      ${n >= 4 ? tg('extremeLong', 'Langes Spiel', (n === 4 ? '8' : '10') + ' statt ' + (n === 4 ? '4' : '5') + ' Runden. Schwarzmagier ab der zweiten Hälfte mit Grundwert 5.') : ''}
      ${n === 3 ? tg('extremeBase5', 'Schwarzmagier Grundwert 5', 'Empfohlene Option für 3 Spieler.') : ''}
      ${n < 3 ? '' : ''}</div>`;
  }
  const err = setupError();
  const tr = err ? null : totalRounds(g);
  h += `<div class="sticky"><div class="in"><div class="sum ${err ? 'hint bad' : ''}" style="${err ? 'color:var(--bad)' : ''}">${err || plural(tr, 'Runde', 'Runden') + ' · ' + n + ' Spieler · ' + (lowWins(s) ? 'wenigste Strafpunkte gewinnen' : 'meiste Punkte gewinnen')}</div>
    <button class="btn" data-act="start" ${err ? 'disabled' : ''}>Spiel starten</button></div></div>`;
  return h;
}
function tg(key, title, text) {
  return `<div class="tg"><div class="tx"><b>${title}</b><span>${text}</span></div><button class="sw ${store.setup[key] ? 'on' : ''}" data-act="toggle" data-k="${key}" aria-label="${title}"></button></div>`;
}
function setupError() {
  const s = store.setup, e = EDITIONS[s.edition], n = s.players.length;
  if (n < e.min) return 'Mindestens ' + e.min + ' Spieler';
  if (n > e.max) return e.name + ' geht mit höchstens ' + e.max + ' Spielern';
  if (s.edition === 'classic' && s.mode === 'einfarbig' && n > 4) return 'Einfarbig geht nur mit 3 oder 4 Spielern';
  return null;
}

/* ===== Spielbildschirm ===== */
function gameHTML() {
  const g = store.game;
  if (g.rounds[g.current] && g.rounds[g.current].done && !ui.sheet) ui.sheet = { type: 'result', r: g.current };
  let h = `<div class="top"><button class="ibtn" data-act="home" aria-label="Start">${I.back}</button>
    <div class="title">${EDITIONS[g.edition].name}${g.edition === 'classic' && g.mode !== 'standard' ? ' · ' + MODES[g.mode] : ''}</div>
    <button class="ibtn" data-act="menu" aria-label="Menü">${I.more}</button></div>`;
  h += ui.tab === 'round' ? roundHTML(g) : tableHTML(g);
  h += `<div class="nav"><button class="${ui.tab === 'round' ? 'on' : ''}" data-act="tab" data-v="round">${I.cards} Runde</button>
    <button class="${ui.tab === 'table' ? 'on' : ''}" data-act="tab" data-v="table">${I.table} Tabelle</button></div>`;
  return h;
}

function roundHTML(g) {
  const r = g.current, rd = g.rounds[r], total = totalRounds(g), c = cardsIn(g, r);
  const d = dealerOf(g, r), done = g.rounds.filter(x => x.done).length;
  let h = gauge(total, done, r, String(r + 1), 'Runde', 'von ' + total + (c !== null ? ' · ' + plural(c, 'Karte', 'Karten') : ''));
  h += `<div class="gmeta"><span class="pill">${av(g.players[d], 'xs')} ${esc(g.players[d].name)} gibt</span>`;
  if (isClassicLike(g)) {
    const t = rd.trump;
    const fixed = g.mode === 'maximus' || g.mode === 'einfarbig' || r === total - 1;
    h += `<button class="pill" ${fixed ? '' : 'data-act="trump"'}><span class="dot" style="background:${t ? TRUMPS[t].c : 'conic-gradient(#3F6FB6 0 25%,#C4473F 0 50%,#3E8F68 0 75%,#D9A92E 0)'}"></span>${t ? TRUMPS[t].n : 'Trumpf wählen'}</button>`;
  }
  h += `</div>`;
  if (g.edition === 'extreme') return h + extremeRoundHTML(g, r, rd, 'live');
  if (g.hellsehen && r === 0) h += `<div class="banner">Hellsehen: Haltet eure Karte an die Stirn, ohne sie selbst anzusehen. Ab Runde 2 wird normal gespielt.</div>`;

  const bidPhase = rd.phase === 'bid';
  h += `<div class="phase"><div class="${bidPhase ? 'on' : 'dn'}"><i>${bidPhase ? '1' : '✓'}</i>Vorhersage</div><div class="${bidPhase ? '' : 'on'}"><i>2</i>Stiche</div></div>`;

  const order = bidOrder(g, r);
  const secretBid = bidPhase && g.bidMode !== 'open';
  const hideBids = !bidPhase && g.bidMode === 'secret';
  if (bidPhase) {
    const sb = sum(rd.bids), set = secretBid ? rd.bids.filter((b, k) => isTipped(rd, k)).length : rd.bids.filter(b => b !== null).length;
    let tag = '';
    if (!secretBid && set) {
      const diff = sb - c;
      tag = diff === 0 ? `<span class="tag mid">Genau aufgeteilt</span>` : diff > 0 ? `<span class="tag bad">${diff} über Stichzahl</span>` : `<span class="tag ok">${-diff} unter Stichzahl</span>`;
    } else if (secretBid) tag = `<span class="tag neu">${set} von ${nP(g)} getippt</span>`;
    h += `<div class="sbar"><div><div class="l">Angesagt</div><div class="n">${secretBid ? '?' : sb} <small>/ ${c} Stiche</small></div></div>${tag}</div>`;
  } else {
    const need = c - (g.edition === 'jubi' && g.bomb && rd.bomb ? 1 : 0), st = sum(rd.tricks);
    const left = need - st;
    const tag = left === 0 ? `<span class="tag ok">Alle verteilt</span>` : left > 0 ? `<span class="tag mid">Noch ${left} offen</span>` : `<span class="tag bad">${-left} zu viel</span>`;
    h += `<div class="sbar"><div><div class="l">Stiche verteilt</div><div class="n">${st} <small>/ ${need}</small></div></div>${tag}</div>`;
  }

  const forb = bidPhase ? forbiddenBid(g, r, rd) : null;
  const nextBidder = undefined;
  const tot = totalsUpTo(g, r);
  order.forEach((i, k) => {
    const p = g.players[i];
    let right = '';
    if (bidPhase) {
      if (secretBid) {
        right = !isTipped(rd, i) ? `<button class="secbtn" data-act="pass" data-i="${i}">Tippen</button>` : `<button class="secbtn done" data-act="pass" data-i="${i}">✓ Getippt</button>`;
      } else right = stepper('live', r, i, 'bids', rd.bids[i]);
    } else {
      const cl = g.edition === 'jubi' && g.cloud && rd.cloud.p === i;
      right = `<div class="bidchip ${cl ? 'cl' : ''}"><small>Ansage</small><b>${hideBids ? '●' : cl ? effBid(g, rd, i) : rd.bids[i]}</b></div>` + stepper('live', r, i, 'tricks', rd.tricks[i]);
    }
    const isDealer = i === d;
    const fb = isDealer && forb !== null && forb <= c ? `<span class="badge ${rd.bids[i] === forb ? 'no' : 'or'}">nicht ${forb}</span>` : '';
    h += `<div class="pl ${nextBidder === i ? 'cur' : ''}">${av(p)}<div class="nm"><b>${esc(p.name)}</b>
      <span>${bidPhase ? `<span class="badge">${k + 1}.</span>` : ''}${isDealer ? '<span class="badge dl">Geber</span>' : ''}${fb}<span>${num(tot[i])} Pkt.</span></span></div>${right}</div>`;
  });

  if (!bidPhase && g.edition === 'jubi' && (g.bomb || g.cloud)) h += specialsHTML(g, rd, 'live');

  const err = bidPhase ? validateBids(g, r, rd) : validateTricks(g, r, rd);
  const soft = bidPhase && err && g.bidMode !== 'open' && allSet(rd.bids) && rd.bids.every((b, k) => isTipped(rd, k)); // Warnung, aber erlaubt
  h += `<div style="margin-top:16px"><button class="btn" data-act="${bidPhase ? 'confirmbids' : 'score'}" ${err && !soft ? 'disabled' : ''}>
    ${bidPhase ? (g.bidMode === 'hidden' ? 'Aufdecken und spielen' : g.bidMode === 'secret' ? 'Tipps abgegeben, spielen' : 'Vorhersagen fertig') : 'Runde werten'}</button>
    <p class="hint ${err ? 'bad' : ''}">${err ? esc(err) : bidPhase ? 'Jetzt die Stiche spielen.' : ''}</p>
    ${!bidPhase ? `<button class="linkbtn" data-act="backbids">Zurück zur Vorhersage</button>` : ''}</div>`;
  return h;
}

function specialsHTML(g, rd, ctx) {
  let h = `<div class="sec" style="margin-top:18px">Sonderkarten</div><div class="opt">`;
  if (g.bomb) h += `<div class="tg"><div class="tx"><b>Bombe gespielt</b><span>Ein Stich zählt für niemanden. Auch einschalten, wenn der Vampir als Bombe gespielt wurde.</span></div>
    <button class="sw ${rd.bomb ? 'on' : ''}" data-act="bomb" data-ctx="${ctx}"></button></div>`;
  if (g.cloud) {
    h += `<div class="tg" style="display:block"><div class="tx"><b>Wolke</b><span>Wer hat den Wolken-Stich gewonnen? Lagen Wolke und Bombe im selben Stich, bleibt es bei Niemand.</span></div>
      <div class="chips" style="margin-top:10px"><button class="chip ${rd.cloud.p < 0 ? 'on' : ''}" data-act="cloudp" data-ctx="${ctx}" data-i="-1">Niemand</button>` +
      g.players.map((p, i) => `<button class="chip ${rd.cloud.p === i ? 'on' : ''}" data-act="cloudp" data-ctx="${ctx}" data-i="${i}">${av(p, 'xs')}${esc(p.name)}</button>`).join('') + `</div>`;
    if (rd.cloud.p >= 0) h += `<div class="seg" style="margin-top:10px"><button class="${rd.cloud.d === -1 ? 'on' : ''}" data-act="cloudd" data-ctx="${ctx}" data-v="-1">Vorhersage −1</button><button class="${rd.cloud.d === 1 ? 'on' : ''}" data-act="cloudd" data-ctx="${ctx}" data-v="1">Vorhersage +1</button></div>`;
    h += `</div>`;
  }
  return h + `</div>`;
}

function stepper(ctx, r, i, f, v, small) {
  return `<div class="stp ${small ? 'sm' : ''}"><button data-act="dec" data-ctx="${ctx}" data-r="${r}" data-i="${i}" data-f="${f}" aria-label="weniger">−</button>
    <span class="val ${v === null ? 'nil' : ''}" data-act="pad" data-ctx="${ctx}" data-r="${r}" data-i="${i}" data-f="${f}">${v === null ? '·' : v}</span>
    <button data-act="inc" data-ctx="${ctx}" data-r="${r}" data-i="${i}" data-f="${f}" aria-label="mehr">+</button></div>`;
}

function extremeRoundHTML(g, r, rd, ctx) {
  const e = rd.ex, bl = sum(e.b);
  let h = `<div class="sbar"><div><div class="l">Schwarze Siegel</div><div class="n">${bl} <small>/ 6</small></div></div>
    <span class="tag neu">Schwarzmagier Grundwert ${extremeBase(g, r)}</span></div>`;
  const tot = totalsUpTo(g, r);
  const tmp = Object.assign({}, g, { rounds: g.rounds.map((x, k) => k === r ? Object.assign({}, rd, { done: true }) : x) });
  g.players.forEach((p, i) => {
    const pen = roundScore(tmp, r, i);
    const mage = e.mage === i;
    h += `<div class="exw"><div class="hd">${av(p)}<div class="nm" style="flex:1;min-width:0"><b style="font-size:16px">${esc(p.name)}</b>
      <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${num(tot[i])} Strafpunkte bisher</div></div>
      <button class="mage ${mage ? 'on' : ''}" data-act="mage" data-ctx="${ctx}" data-i="${i}">Schwarzmagier</button></div>
      <div class="ex">${mage ? '' : `<div class="c"><small>Farbig ×2</small>${stepper(ctx, r, i, 'c', e.c[i], 1)}</div>`}
      <div class="c" ${mage ? 'style="grid-column:1/3"' : ''}><small>Schwarz ×3</small>${stepper(ctx, r, i, 'b', e.b[i], 1)}</div>
      ${mage ? `<div class="c" style="display:flex;flex-direction:column;justify-content:center"><small>Strafe</small><b style="font-size:20px">${pen}</b></div>` : `<div class="c"><small>Weiß ×4</small>${stepper(ctx, r, i, 'w', e.w[i], 1)}</div>`}</div>
      ${mage ? '' : `<div style="display:flex;justify-content:flex-end;margin-top:8px;font-size:13px;color:var(--muted);font-weight:600">Diese Runde: <b style="color:var(--ink);margin-left:6px">${pen}</b></div>`}</div>`;
  });
  if (ctx === 'live') {
    const err = validateTricks(g, r, rd);
    h += `<div style="margin-top:16px"><button class="btn" data-act="score" ${err ? 'disabled' : ''}>Runde werten</button>
      <p class="hint ${err ? 'bad' : ''}">${err ? esc(err) : 'Übrig gebliebene Siegel eintragen.'}</p></div>`;
  }
  return h;
}

/* ===== Statistik ===== */
const GEMS = [['#D98B56', '#F2B88E'], ['#8E6BD6', '#BBA2F2'], ['#2FA59B', '#78D6C6'], ['#D4607E', '#F29DB2']];
const isHit = (g, rd, i) => g.edition === 'junior' ? rd.tricks[i] === rd.bids[i] : rd.tricks[i] === effBid(g, rd, i);
function lighten(hex, k) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255, f = c => Math.round(c + (255 - c) * k);
  return '#' + [f(r), f(gg), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function gem(c1, c2, size) {
  return `<i class="gem" style="width:${size}px;height:${size}px;background:radial-gradient(circle at 32% 28%, #fff 0 14%, ${c2} 30%, ${c1} 78%)"></i>`;
}
function bar(pct, c1, c2, min = 4) {
  const w = pct <= 0 ? 0 : Math.max(min, Math.min(100, pct));
  return `<div class="bar"><span style="width:${w}%;background:linear-gradient(90deg, ${c1}, ${c2})"></span></div>`;
}
function playerStats(g, i) {
  const rs = g.rounds.map((rd, r) => ({ rd, r })).filter(x => x.rd.done);
  const sc = rs.map(x => roundScore(g, x.r, i));
  const st = { rounds: rs.length, total: sc.reduce((a, b) => a + b, 0), scores: sc };
  st.avg = st.rounds ? st.total / st.rounds : 0;
  st.best = sc.length ? (lowWins(g) ? Math.min(...sc) : Math.max(...sc)) : 0;
  st.worst = sc.length ? (lowWins(g) ? Math.max(...sc) : Math.min(...sc)) : 0;
  if (g.edition === 'extreme') {
    st.clean = sc.filter(v => v === 0).length;
    st.mage = rs.filter(x => x.rd.ex.mage === i).length;
    let run = 0; st.streak = 0; sc.forEach(v => { run = v === 0 ? run + 1 : 0; st.streak = Math.max(st.streak, run); });
    st.rate = st.rounds ? st.clean / st.rounds : 0;
    return st;
  }
  const hits = rs.map(x => isHit(g, x.rd, i));
  st.hits = hits.filter(Boolean).length;
  st.rate = st.rounds ? st.hits / st.rounds : 0;
  let run = 0; st.streak = 0; hits.forEach(h => { run = h ? run + 1 : 0; st.streak = Math.max(st.streak, run); });
  st.cur = run;
  st.over = rs.filter(x => x.rd.tricks[i] < (g.edition === 'junior' ? x.rd.bids[i] : effBid(g, x.rd, i))).length;
  st.under = rs.filter(x => x.rd.tricks[i] > (g.edition === 'junior' ? x.rd.bids[i] : effBid(g, x.rd, i))).length;

const pct = v => Math.round(v * 100) + ' %';
const fmtAvg = v => (Math.round(v * 10) / 10).toLocaleString('de-DE');

function statHead(title, meta) {

}

function tableHTML(g) {
  const tab = ui.statTab || 'rank';
  const done = g.rounds.filter(x => x.done).length;
  let h = statHead('Statistik', done ? plural(done, 'Runde', 'Runden') + ' gewertet' : '');
  h += `<div class="seg" style="margin-bottom:14px">${[['rank', 'Rangliste'], ['block', 'Block'], ['chart', 'Verlauf']].map(([k, v]) => `<button class="${tab === k ? 'on' : ''}" data-act="stattab" data-v="${k}">${v}</button>`).join('')}</div>`;
  if (!done && tab !== 'block') return h + `<div class="card"><div class="empty">Nach der ersten gewerteten Runde erscheinen hier Rangliste und Werte.</div></div>`;
  if (tab === 'rank') h += leaderCard(g) + rankList(g);
  else if (tab === 'block') h += blockTable(g);

}

function leaderCard(g, final) {
  const rk = ranking(g), first = rk[0], p = g.players[first.i], st = playerStats(g, first.i);
  const gap = rk[1] ? Math.abs(first.score - rk[1].score) : 0;
  const tied = rk.filter(x => x.pos === 1).length > 1;
  const done = g.rounds.filter(x => x.done).length;
  const kpi3 = g.edition === 'extreme' ? ['Ohne Strafe', String(st.clean)] : ['Trefferquote', pct(st.rate)];
  return `<div class="lcard pop"><div class="lrow">
      <div class="lav" style="--pc:${p.color}">${av(p)}<span class="lbadge">${tied ? 'gleichauf' : final ? 'Sieger' : 'Platz 1'}</span></div>
      <div class="lnm"><small>${final ? 'Endstand' : 'Führung'}</small><b>${esc(tied ? rk.filter(x => x.pos === 1).map(x => g.players[x.i].name).join(' & ') : p.name)}</b></div>
      <div class="lsc"><b>${num(first.score)}</b><small>${lowWins(g) ? 'Strafpunkte' : 'Punkte'}</small></div></div>
    <div class="kpis"><div><b>${final ? done : done + '/' + totalRounds(g)}</b><small>Runden</small></div>
      <div><b>${tied ? 0 : gap}</b><small>Vorsprung</small></div><div><b>${kpi3[1]}</b><small>${kpi3[0]}</small></div></div></div>`;
}

function rankList(g) {
  const rk = ranking(g), sc = rk.map(x => x.score);
  const mx = Math.max(...sc), mn = Math.min(...sc), span = mx - mn || 1;
  return `<div class="sec">${lowWins(g) ? 'Strafpunkte' : 'Punktestand'}<span style="text-transform:none;letter-spacing:0">Spieler antippen für Details</span></div><div class="card rlist">` +
    rk.map(x => {
      const p = g.players[x.i], st = playerStats(g, x.i);
      const rel = lowWins(g) ? (mx - x.score) / span : (x.score - mn) / span;
      const sub = g.edition === 'extreme' ? `${st.clean} von ${st.rounds} ohne Strafe` : `${st.hits} von ${st.rounds} getroffen${st.cur >= 2 ? ' · Serie ' + st.cur : ''}`;
      return `<button class="rrow" data-act="player" data-i="${x.i}"><span class="rpos ${x.pos === 1 ? 'one' : ''}">${x.pos}</span>${av(p, 'sm')}
        <span class="rmid"><span class="rtop"><b>${esc(p.name)}</b><em>${num(x.score)}</em></span>
        <span class="rbar">${gem(p.color, lighten(p.color, .45), 14)}${bar(12 + rel * 88, p.color, lighten(p.color, .45))}</span>
        <small>${sub}</small></span></button>`;

}

function blockTable(g) {
  const n = nP(g);
  let h = `<div class="tblw"><div class="tbls"><table class="blk"><thead><tr><th class="rn">Rd.</th>` +
    g.players.map(p => `<th><div class="thn">${av(p, 'xs')}<span>${esc(p.name)}</span></div></th>`).join('') + `</tr></thead><tbody>`;
  const run = Array(n).fill(0);
  g.rounds.forEach((rd, r) => {
    const editable = rd.done;
    h += `<tr class="${editable ? 'edr' : 'open'}" ${editable ? `data-act="editround" data-r="${r}"` : ''}><td class="rn">${r + 1}</td>`;
    for (let i = 0; i < n; i++) {
      const s = roundScore(g, r, i);
      if (s === null) {
        const showBid = g.edition !== 'extreme' && rd.phase === 'tricks' && g.bidMode !== 'secret';
        h += `<td><span class="tot nil">${showBid ? rd.bids[i] : '·'}</span>${showBid ? '<span class="sub">Ansage</span>' : ''}</td>`;
        continue;
      }
      run[i] += s;
      if (g.edition === 'extreme') {
        h += `<td><span class="tot">${run[i]}</span><span class="sub"><i class="dot ${s === 0 ? 'ok' : 'bad'}"></i>+${s}${rd.ex.mage === i ? ' SM' : ''}</span></td>`;
      } else {

      }

    h += `</tr>`;
  });
  const t = totals(g), rk = ranking(g), any = g.rounds.some(x => x.done);
  h += `</tbody><tfoot><tr><td class="rn">Σ</td>` + t.map((v, i) => `<td class="${any && rk[0].i === i ? 'lead' : ''}">${num(v)}</td>`).join('') + `</tr></tfoot></table></div></div>`;
  h += `<p class="hint" style="text-align:left;margin:8px 6px 0">${g.edition === 'extreme' ? 'Unten: Strafpunkte der Runde, SM für Schwarzmagier.' : 'Unten: Ansage/Stiche, Punkt grün bei Treffer.'} Gewertete Runden antippen zum Bearbeiten.</p>`;
  return h;
}

function chartHTML(g) {
  const done = g.rounds.filter(r => r.done).length;
  if (done < 1) return '';
  const series = g.players.map(() => [0]);
  for (let r = 0; r < done; r++) { const t = totalsUpTo(g, r + 1); t.forEach((v, i) => series[i].push(v)); }
  let mn = 0, mx = 0;
  series.forEach(s => s.forEach(v => { mn = Math.min(mn, v); mx = Math.max(mx, v); }));
  if (mx === mn) mx = mn + 10;
  const W = 330, H = 190, pl = 34, pr = 10, pt = 12, pb = 24;
  const X = k => pl + (W - pl - pr) * k / done, Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let s = '';
  const step = niceStep((mx - mn) / 4);
  for (let v = Math.ceil(mn / step) * step; v <= mx; v += step) {
    s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" ${v === 0 ? '' : 'stroke-dasharray="2 5"'}/>`;
    s += `<text x="${pl - 8}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" font-weight="600" style="fill:var(--muted)">${num(v)}</text>`;
  }
  const ticks = done <= 10 ? [...Array(done).keys()].map(k => k + 1) : [1, Math.round(done / 2), done];
  ticks.forEach(k => { s += `<text x="${X(k)}" y="${H - 6}" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--muted)">${k}</text>`; });
  const rk = ranking(g);
  [...rk].reverse().forEach(x => {
    const i = x.i, sr = series[i], c = g.players[i].color;
    const pts = sr.map((v, k) => X(k).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${x.pos === 1 ? 3 : 2.2}" stroke-linejoin="round" stroke-linecap="round" opacity="${x.pos === 1 ? 1 : .8}"/>`;
    s += `<circle cx="${X(done)}" cy="${Y(sr[done])}" r="4.5" fill="${c}" style="stroke:var(--card)" stroke-width="2.5"/>`;
  });
  return `<div class="card chart"><div class="ctitle"><b>Punkteverlauf</b><small>Runde 1 bis ${done}</small></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>
    <div class="lg">${rk.map(x => { const p = g.players[x.i]; return `<span><i style="background:${p.color}"></i>${esc(p.name)}</span>`; }).join('')}</div></div>`;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1)))), f = raw / p;

    return `<div class="card rbars">${only === undefined ? `<div class="rbh">${av(p, 'xs')}<b>${esc(p.name)}</b></div>` : ''}<div class="rbcols">${cols}</div></div>`;

  if (g.edition !== 'extreme') h += `<div class="kpis card" style="margin-top:12px"><div><b>${num(st.best)}</b><small>Beste Runde</small></div><div><b>${num(st.worst)}</b><small>Schlechteste</small></div><div><b>${st.cur}</b><small>Aktuelle Serie</small></div></div>`;

function sheet(inner, tall) { return `<div class="ov" data-act="ovclose"><div class="sh" ${tall ? 'style="max-height:94vh"' : ''}><div class="grab"></div>${inner}</div></div>`; }

    }).join('');

  }
  let err = null;
  if (g.edition !== 'extreme') err = !allSet(rd.bids) ? 'Ansagen fehlen' : (g.plusMinus && g.bidMode === 'open' ? validateBids(g, r, rd) : null);
  err = err || validateTricks(g, r, rd);
  h += `<div style="margin-top:14px;display:grid;gap:8px"><button class="btn" data-act="saveedit" ${err ? 'disabled' : ''}>Speichern</button>
    <p class="hint ${err ? 'bad' : ''}" style="margin:0">${err ? esc(err) : ''}</p><button class="btn light" data-act="close">Abbrechen</button></div>`;
  return h;
}

function rulesHTML() {
  const ed = (store.game || ui.view || store.setup).edition;
  const blocks = {
    classic: `<h4>Wizard (Klassik, Deluxe, Das Schwarze Auge)</h4><ul>

      <li>Plus/Minus Eins, Verdeckter Tipp und Geheime Vorhersage sind auch mit Sonderkarten spielbar.</li></ul>`,
    junior: `<h4>Wizard Junior</h4><ul><li>Richtige Vorhersage: 1 Punkt pro Stich. Wer richtig 0 Stiche ansagt, bekommt 1 Punkt.</li>

    extreme: `<h4>Wizard Extreme</h4><ul><li>Gewonnen hat, wer die wenigsten Strafpunkte hat.</li>
      <li>Übrige farbige Siegel: 2 Strafpunkte, schwarze Siegel: 3, weiße Siegel: 4.</li>

      <li>Höchstens 6 schwarze Siegel pro Runde.</li>

  };

  return `<h3>Regeln und Wertung</h3><p class="s">Kurzfassung je Version, die aktuelle steht oben.</p><div class="rules card">${order.map(k => blocks[k]).join('')}</div>
    <div style="margin-top:14px"><button class="btn light" data-act="close">Schließen</button></div>`;
}

/* ===== Aktionen ===== */
function setVal(ctx, r, i, f, v) {
  const g = store.game, rd = refRound(ctx, r);
  if (f === 'bids' || f === 'tricks') rd[f][i] = v; else rd.ex[f][i] = v;
  if (ctx === 'live') save();
}
function step(ctx, r, i, f, dir) {
  const g = store.game, rd = refRound(ctx, r);
  const cur = f === 'bids' || f === 'tricks' ? rd[f][i] : rd.ex[f][i];
  const max = padMax({ f, r });
  let v = cur === null ? 0 : cur + dir;
  if (cur === null && dir < 0) v = 0;
  const forb = f === 'bids' && ctx === 'live' && i === dealerOf(g, r) ? forbiddenBid(g, r, rd) : null;
  if (forb !== null && v === forb) v += dir;
  if (v < 0 || v > max) return;
  setVal(ctx, r, i, f, v);
}
function startGame(base) {
  const s = base || store.setup;
  const players = s.players.map((p, i) => ({ name: (p.name || '').trim() || 'Spieler ' + (i + 1), color: p.color || COLORS[i % COLORS.length] }));
  const g = {
    id: Date.now().toString(36), created: Date.now(), edition: s.edition,
    mode: s.edition === 'classic' ? s.mode : 'standard', bidMode: isClassicLike(s) ? s.bidMode : 'open',
    plusMinus: isClassicLike(s) && s.plusMinus, hellsehen: s.edition === 'classic' && s.mode === 'standard' && s.hellsehen,
    bomb: s.edition === 'jubi' && s.bomb, cloud: s.edition === 'jubi' && s.cloud,
    extremeLong: s.edition === 'extreme' && players.length >= 4 && s.extremeLong,
    extremeBase5: s.edition === 'extreme' && players.length === 3 && s.extremeBase5,
    players, firstDealer: Math.min(s.firstDealer, players.length - 1), rounds: [], current: 0
  };
  g.rounds.push(newRound(g, 0));
  store.game = g; store.lastNames = players.map(p => p.name);
  ui.screen = 'game'; ui.tab = 'round'; ui.sheet = null; ui.view = null;
  save(); render(); window.scrollTo(0, 0);
}
function finishGame() {
  const g = store.game;
  g.rounds = g.rounds.filter(r => r.done);
  g.finished = Date.now();
  store.history.unshift(JSON.parse(JSON.stringify(g)));
  store.history = store.history.slice(0, 40);
  ui.view = g; store.game = null; ui.screen = 'end'; ui.sheet = null;
  save(); render(); window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, d = el.dataset, s = store.setup, g = store.game;
  if (a === 'ovclose') { if (e.target === el && !(ui.sheet && ui.sheet.type === 'result')) { ui.sheet = ui.sheet && ui.sheet.parent ? ui.sheet.parent : null; renderLayer(); } return; }
  switch (a) {
    case 'home': ui.screen = 'home'; break;
    case 'resume': ui.screen = 'game'; break;
    case 'newgame':
      if (store.game) { ui.sheet = { type: 'confirm', title: 'Neues Spiel?', text: 'Das laufende Spiel wird verworfen.', yes: 'gosetup', yesLabel: 'Verwerfen und neu' }; renderLayer(); return; }
      freshPlayers(); ui.screen = 'setup'; break;
    case 'gosetup': store.game = null; ui.sheet = null; freshPlayers(); ui.screen = 'setup'; break;
    case 'recent': {
      const free = s.players.findIndex(p => !(p.name || '').trim());
      if (free >= 0) s.players[free].name = d.v;
      else if (s.players.length < EDITIONS[s.edition].max) { const used = s.players.map(p => p.color); s.players.push({ name: d.v, color: COLORS.find(c => !used.includes(c)) || COLORS[0] }); }
      break;
    }
    case 'ed': s.edition = d.v; { const e2 = EDITIONS[d.v]; while (s.players.length > e2.max) s.players.pop(); while (s.players.length < e2.min) s.players.push({ name: '', color: COLORS[s.players.length % COLORS.length] }); } if (s.firstDealer >= s.players.length) s.firstDealer = 0; break;
    case 'mode': s.mode = d.v; break;
    case 'bidmode': s.bidMode = d.v; break;
    case 'toggle': s[d.k] = !s[d.k]; break;
    case 'padd': { const used = s.players.map(p => p.color); s.players.push({ name: '', color: COLORS.find(c => !used.includes(c)) || COLORS[0] }); break; }
    case 'pdel': s.players.splice(+d.i, 1); if (s.firstDealer >= s.players.length) s.firstDealer = 0; break;
    case 'pup': { const i = +d.i; [s.players[i - 1], s.players[i]] = [s.players[i], s.players[i - 1]]; break; }
    case 'dealer': s.firstDealer = +d.i; break;
    case 'start': if (!setupError()) { startGame(); return; } break;
    case 'tab': ui.tab = d.v; break;
    case 'stattab': ui.statTab = d.v; break;
    case 'player': ui.sheet = { type: 'player', i: +d.i }; renderLayer(); return;
    case 'theme': store.theme = store.theme === 'dark' ? 'light' : 'dark'; applyTheme(); if (ui.sheet && ui.sheet.type === 'menu') ui.sheet = null; break;
    case 'inc': case 'dec': step(d.ctx, +d.r, +d.i, d.f, a === 'inc' ? 1 : -1); break;
    case 'pad': ui.sheet = { type: 'pad', ctx: d.ctx, r: +d.r, i: +d.i, f: d.f, draft: ui.sheet && ui.sheet.draft, parent: ui.sheet && ui.sheet.type === 'edit' ? ui.sheet : null }; break;
    case 'padset': { const sh = ui.sheet; setVal(sh.ctx, sh.r, sh.i, sh.f, +d.v); ui.sheet = sh.parent || null; break; }
    case 'pass': ui.sheet = { type: 'pass', i: +d.i, stage: 'hand' }; break;
    case 'passshow': ui.sheet.stage = 'pick'; break;
    case 'passset': { const rd = g.rounds[g.current]; rd.bids[ui.sheet.i] = +d.v; if (!rd.tipped) rd.tipped = rd.bids.map(b => b !== null); rd.tipped[ui.sheet.i] = true; ui.sheet = null; save(); break; }
    case 'confirmbids': { const rd = g.rounds[g.current]; const err = validateBids(g, g.current, rd); if (err && (g.bidMode === 'open' || !rd.bids.every((b, k) => isTipped(rd, k)))) return; rd.tricks = rd.tricks.map(t => t === null ? 0 : t); rd.phase = 'tricks'; save(); break; }
    case 'backbids': g.rounds[g.current].phase = 'bid'; save(); break;
    case 'bomb': { const rd = refRound(d.ctx, g.current); if (d.ctx === 'edit') ui.sheet.draft.bomb = !ui.sheet.draft.bomb; else { rd.bomb = !rd.bomb; save(); } break; }
    case 'cloudp': { const rd = d.ctx === 'edit' ? ui.sheet.draft : g.rounds[g.current]; rd.cloud.p = +d.i; if (d.ctx === 'live') save(); break; }
    case 'cloudd': { const rd = d.ctx === 'edit' ? ui.sheet.draft : g.rounds[g.current]; rd.cloud.d = +d.v; if (d.ctx === 'live') save(); break; }
    case 'mage': { const rd = d.ctx === 'edit' ? ui.sheet.draft : g.rounds[g.current]; const i = +d.i; rd.ex.mage = rd.ex.mage === i ? -1 : i; if (rd.ex.mage === i) { rd.ex.c[i] = 0; rd.ex.w[i] = 0; } if (d.ctx === 'live') save(); break; }
    case 'score': {
      const r = g.current, rd = g.rounds[r];
      if (validateTricks(g, r, rd)) return;
      if (g.edition !== 'extreme' && !allSet(rd.bids)) return;
      rd.done = true; save(); ui.sheet = { type: 'result', r }; break;
    }
    case 'next': {
      const r = ui.sheet.r; ui.sheet = null;
      if (r >= totalRounds(g) - 1) { finishGame(); return; }
      g.current = r + 1; if (!g.rounds[g.current]) g.rounds.push(newRound(g, g.current));
      save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    }
    case 'trump': ui.sheet = { type: 'trump' }; break;
    case 'settrump': g.rounds[g.current].trump = d.v || null; ui.sheet = null; save(); break;
    case 'menu': ui.sheet = { type: 'menu' }; break;
    case 'rules': ui.sheet = { type: 'rules' }; break;
    case 'close': ui.sheet = ui.sheet && ui.sheet.parent ? ui.sheet.parent : null; break;
    case 'editround': { const r = +d.r; ui.sheet = { type: 'edit', r, draft: JSON.parse(JSON.stringify(g.rounds[r])) }; break; }
    case 'saveedit': { const sh = ui.sheet; sh.draft.done = true; sh.draft.phase = 'tricks'; g.rounds[sh.r] = sh.draft; ui.sheet = null; save(); break; }
    case 'finishnow': ui.sheet = { type: 'confirm', title: 'Jetzt beenden?', text: 'Gewertet werden nur die bereits abgeschlossenen Runden.', yes: 'dofinish', yesLabel: 'Beenden und werten' }; break;
    case 'dofinish': finishGame(); return;
    case 'discard': ui.sheet = { type: 'confirm', title: 'Spiel verwerfen?', text: 'Alle Eingaben dieses Spiels gehen verloren.', yes: 'dodiscard', yesLabel: 'Verwerfen' }; break;
    case 'dodiscard': store.game = null; ui.sheet = null; ui.screen = 'home'; save(); break;
    case 'leaveend': ui.view = null; ui.screen = 'home'; break;
    case 'viewhist': ui.view = store.history[+d.k]; ui.screen = 'end'; break;
    case 'clearhist': ui.sheet = { type: 'confirm', title: 'Verlauf leeren?', text: 'Alle gespeicherten Spiele werden gelöscht.', yes: 'doclear', yesLabel: 'Leeren' }; break;
    case 'doclear': store.history = []; ui.sheet = null; save(); break;
    case 'rematch': {
      const v = ui.view;
      const base = Object.assign({}, v, { players: v.players.map(p => ({ ...p })), firstDealer: (v.firstDealer + 1) % v.players.length });
      startGame(base); return;
    }
  }
  if (ui.sheet && ui.sheet.parent && ui.sheet.type === 'edit') ui.sheet.parent = null;
  save();
  if (a === 'pad' || a === 'pass' || a === 'passshow' || a === 'trump' || a === 'menu' || a === 'rules' || a === 'editround' || a === 'finishnow' || a === 'discard' || a === 'clearhist') { renderLayer(); return; }
  if (ui.sheet && ui.sheet.type === 'edit' && ['inc', 'dec', 'bomb', 'cloudp', 'cloudd', 'mage'].includes(a) && d.ctx === 'edit') { const y = $('.sh') ? $('.sh').scrollTop : 0; renderLayer(); if ($('.sh')) $('.sh').scrollTop = y; return; }
  const y = window.scrollY; render();
  if (!['home', 'resume', 'gosetup', 'tab', 'leaveend', 'viewhist', 'newgame'].includes(a)) window.scrollTo(0, y); else window.scrollTo(0, 0);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.name !== undefined) {
    const i = +t.dataset.name; store.setup.players[i].name = t.value;
    const avEl = t.parentElement.querySelector('.av'); if (avEl) avEl.textContent = ini(t.value);
    const ch = document.querySelector('[data-act="dealer"][data-i="' + i + '"]');
    if (ch) ch.innerHTML = av(store.setup.players[i], 'xs') + esc(t.value || 'Spieler ' + (i + 1));
    save();
  }
});
/* ===== App-Schicht: Native (Capacitor) und installierte Web-App ===== */
const Cap = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor : null;
const plug = n => Cap && Cap.Plugins ? Cap.Plugins[n] : null;
function nativeStatusBar() {
  const sb = plug('StatusBar'); if (!sb) return;
  try { sb.setStyle({ style: store.theme === 'dark' ? 'DARK' : 'LIGHT' }); } catch (e) {}
  try { sb.setBackgroundColor({ color: store.theme === 'dark' ? '#17191E' : '#EFEDEA' }); } catch (e) {}
}
const _applyTheme = applyTheme;
applyTheme = function () { _applyTheme(); nativeStatusBar(); };
nativeStatusBar();
function tick() {
  const h = plug('Haptics');
  if (h) { try { h.impact({ style: 'LIGHT' }); } catch (e) {} }
  else if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && /^(inc|dec|padset|passset|score|confirmbids|next)$/.test(el.dataset.act)) tick();
}, true);
// Bildschirm bleibt an, solange ein Spiel läuft
let wakeLock = null;
async function keepAwake() {
  const want = !!store.game && ui.screen === 'game' && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
const _render = render;
render = function () { _render(); keepAwake(); };
document.addEventListener('visibilitychange', keepAwake);
// Android-Zurück-Taste
const appPlug = plug('App');
if (appPlug) appPlug.addListener('backButton', () => {
  if (ui.sheet) { if (ui.sheet.type !== 'result') { ui.sheet = ui.sheet.parent || null; renderLayer(); } return; }
  if (ui.screen !== 'home') { ui.view = null; ui.screen = 'home'; render(); window.scrollTo(0, 0); return; }
  appPlug.exitApp();
});
// Offline-Betrieb für die installierte Web-App
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !Cap) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
render();
</script>
